# ════════════════════════════════════════════════════════════════════════════════════════════════
# Trecho a inserir no vhost `bot.ragnatela.com.br` do proxy reverso (XSEPRXRVS001),
# ANTES do `location /`. Contrato S-PUBLICAR, 02/09/2026.
#
# O QUE É: `/painel/` é a INTERFACE DO MOTOR — o construtor de fluxo, o testador, as respostas
# rápidas, as caixas de entrada e o cadastro de empresas. É a porta de GENTE.
# Não confundir com `/motor-api/` (arquivo vizinho `bot-motor-api.conf`), que é a porta de SERVIÇO
# do NOC e continua com `allow …; deny all;` — intocada.
#
# ── POR QUE UM `location` PRÓPRIO, E NÃO DEIXAR CAIR NO `location /` ────────────────────────────
# Porque o `location /` deste vhost NÃO é um proxy simples: ele injeta, em TODO HTML que passa,
#   · `/tema-ragnabot.css`  — o tema do painel de atendimento, com 137 variáveis de cor remapeadas;
#   · `/carregando.js`      — a tela de carregamento com progresso, que só some quando o painel do
#                             Chatwoot desenha. Sobre a nossa tela ela ficaria por cima, para
#                             sempre, e o sintoma seria «o painel não abre»;
#   · o widget do «não sou robô» e o `<link rel=icon>` da plataforma.
# Nada disso é da interface do motor. Um `location ^~` próprio entrega o HTML como ele saiu do
# motor. E, por ser `^~`, ele também impede que `location ~* ^/(vite|packs|assets|brand-assets)/`
# (o cache de 30 dias dos arquivos do Chatwoot) sequestre qualquer coisa daqui.
#
# ── O QUE NÃO MUDA ──────────────────────────────────────────────────────────────────────────────
# Nenhuma trava foi afrouxada para publicar. A porta de entrada continua sendo a TELA DE LOGIN do
# próprio motor, com a conta da plataforma (cookie assinado, `HttpOnly`, `SameSite=Strict`, 8 h).
# O guarda anti-robô do Turnstile não entra aqui de propósito: ele protege `POST /auth/sign_in` da
# plataforma, que é outro caminho e outro formulário.
# ════════════════════════════════════════════════════════════════════════════════════════════════

# Sem esta linha, digitar `bot.ragnatela.com.br/painel` (sem a barra) cairia no `location /` e
# abriria o painel de ATENDIMENTO — o usuário juraria que o endereço está errado.
location = /painel { return 301 https://$host/painel/; }

# ════════════════════════════════════════════════════════════════════════════════════════════════
# ⏳ PROPOSTO, AINDA NÃO APLICADO — UM ENDEREÇO SÓ (contrato S-CLAREZA, 03/09/2026)
#
# O dono: «não entendi nada, por que tem outra autenticação para acessar esse /painel… tá muito
# confuso». Metade da confusão é esta: o endereço que a pessoa digita (`bot.ragnatela.com.br`)
# entrega o painel do FORNECEDOR, e o nosso painel é um lugar que só abre quem SABE que `/painel/`
# existe. Com a linha abaixo, a raiz passa a levar ao painel único.
#
# ⛔ NÃO ESTÁ NO VHOST DO PROXY. A escrita em `/etc/nginx` do proxy compartilhado foi recusada pelo
# sistema de permissão desta sessão, e o roteiro da casa manda PARAR e devolver a decisão — não
# contornar. As quatro linhas ficam aqui, prontas, para o chefe aplicar; o texto abaixo é a medição
# que embasa a proposta.
#
# ── POR QUE É PEQUENA, e por que é justamente esta forma ────────────────────────────────────────
# `location =` é CASAMENTO EXATO: só o caminho `/` pelado é desviado. `/app/…` (o painel de
# atendimento), `/auth/…`, `/api/…`, `/cable`, `/widget`, `/packs/…` e `/super_admin` continuam
# caindo exatamente onde caem hoje, com a injeção de tema, o `carregando.js` e o guarda anti-robô
# intactos. Nenhum vizinho do proxy é tocado: a linha vive dentro deste vhost.
#
# ── O QUE FOI MEDIDO ANTES DE PROPOR (03/09/2026) ───────────────────────────────────────────────
#   · no log deste vhost (`bot-ragnatela_access.log`), quem pede `/` são navegadores humanos
#     chegando e robôs de busca. NENHUM serviço depende deste caminho: a rota funcional do produto
#     (`/app/…`, `/api/…`, `/cable`, `/widget`, `/packs/…`) não passa por ele;
#   · no código da plataforma em uso, a raiz é `root to: 'dashboard#index'` — a MESMA casca Vue de
#     `/app/…`. Desviar a raiz não tira função nenhuma de lugar: quem quiser o painel do fornecedor
#     direto continua abrindo `/app/…`;
#   · o proxy hospeda ~20 domínios e NÃO tem `default_server` explícito na 443 — este vhost é
#     carregado por último (`zzz-bot-ragnatela`) e continua assim; a mudança não mexe na ordem.
#
# ── 302 E NÃO 301, de propósito ─────────────────────────────────────────────────────────────────
# 301 fica gravado no navegador de cada pessoa da equipe para sempre; um dia de arrependimento
# custaria pedir a todo mundo que limpasse o cache. 302 volta atrás apagando as quatro linhas.
#
# ── UM EFEITO DE BORDA CONHECIDO, dito antes de acontecer ──────────────────────────────────────
# A plataforma manda o navegador para `/` depois do «Sair» dela (config `LOGOUT_REDIRECT_LINK`
# vazia). Com o desvio, quem sair pelo painel do fornecedor cai no nosso painel. Se a sessão do
# Ragnabot ainda valer, ele entra; as telas embutidas pedirão a entrada do fornecedor e, ao
# entrar, voltam a funcionar sozinhas (a interface dele regrava a credencial). Não há travamento —
# há um passo a mais, no caso de quem sai por lá.
#
# ── COMO APLICAR (roteiro da casa) ──────────────────────────────────────────────────────────────
#   1. respaldo CÓPIA REAL em `/root/nginx-backups/`, FORA de `sites-enabled`;
#   2. inserir o bloco imediatamente ANTES do `location / {` do bloco 443;
#   3. `nginx -t` — reprovou, restaura o respaldo e NÃO recarrega;
#   4. `nginx -t` de novo e `systemctl reload nginx` (NUNCA `restart`: são ~20 sites);
#   5. conferir: `/` → 302 para `/painel/` · `/app/login` → 200 · `/painel/` → 200 ·
#      `/motor-api/` → 403 · vizinhos (chat001, site, painel, sisac) intactos.
# ════════════════════════════════════════════════════════════════════════════════════════════════
# location = / { return 302 https://$host/painel/; }

location ^~ /painel/ {
    # ── PROTEÇÃO DE MOLDURA (contrato S-DEPLOY-5, 03/09/2026) ───────────────────────────────────
    # MEDIDO em 02/09/2026, de fora e pelo vhost real: o `/painel/` respondia **sem**
    # `X-Frame-Options`. Ou seja, qualquer site de terceiro podia embutir a NOSSA casca numa
    # moldura invisível e colher o clique de quem estivesse logado (clickjacking). A raiz do mesmo
    # host — o painel do fornecedor — já respondia `SAMEORIGIN` desde sempre; só a nossa metade é
    # que estava descoberta.
    #
    # `SAMEORIGIN`, e NÃO `DENY`: desde a v1.11.00 a própria casca embute telas do painel de
    # atendimento, que moram no MESMO host. `DENY` quebraria o painel único de uma vez.
    #
    # ⚠️ OS TRÊS JUNTOS, E ISSO NÃO É EXCESSO — é a armadilha do `add_header` do nginx. Um
    # `add_header` no nível do `server` só é herdado por um `location` que não declare NENHUM
    # `add_header` próprio. Pôr aqui apenas o `X-Frame-Options` faria o `/painel/` PERDER, em
    # silêncio, o `Strict-Transport-Security` e o `Permissions-Policy` que hoje ele recebe do
    # `server`. Trocar uma proteção por outra não é acrescentar proteção. Repetir é o que mantém.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;

    proxy_pass http://ragnabot_k8s;
    proxy_http_version 1.1;

    # ── AS DUAS LINHAS QUE FALTAVAM AQUI ATÉ 03/09/2026 ─────────────────────────────────────────
    # ⚠️ Esta cópia esteve DEFASADA em relação ao vhost real, e a diferença não era cosmética: o
    # vhost no ar tem as duas linhas abaixo e este arquivo não tinha. Quem recriasse o ambiente a
    # partir daqui subiria um proxy que NÃO deixa a conexão passar de HTTP para fluxo contínuo.
    #
    # Elas servem a DOIS caminhos:
    #   · `/painel/atendimento/ao-vivo` — o fluxo de eventos (SSE) que faz a caixa se atualizar
    #     sozinha desde a v1.14.00. Sem isto, a caixa volta a depender de F5;
    #   · qualquer WebSocket que a interface do motor venha a usar.
    #
    # `$ragnabot_conn_upgrade` NÃO nasce aqui: vem do `map` em
    # `/etc/nginx/conf.d/chat002-upstream.conf`, ao lado do `upstream ragnabot_k8s` —
    #     map $http_upgrade $ragnabot_conn_upgrade { default upgrade; '' close; }
    # O `map` tem de existir ANTES, e o nome é único de propósito: nome de `map` repetido entre os
    # ~20 sites do proxy quebra o nginx INTEIRO, não só este vhost.
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $ragnabot_conn_upgrade;

    # O construtor de fluxo é uma tela grande e a resposta do motor pode ser um JSON gordo.
    # `Accept-Encoding` NÃO é zerado aqui (ao contrário do `location /`): não há `sub_filter`
    # nenhum a aplicar, e deixar a compressão passar economiza banda de quem está no celular.

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # `https` fixo, e não `$scheme`: o TLS termina AQUI. Sem isto o motor entenderia que a conexão
    # é insegura e recusaria emitir o cookie de sessão com `Secure` — a pessoa entraria e voltaria
    # para a tela de login em looping, sem mensagem de erro nenhuma.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_cookie_flags ~ secure;

    proxy_connect_timeout 10s;
    # ⚠️ 120 s é o TETO DE SILÊNCIO de um fluxo SSE: se o motor passar esse tempo sem mandar nada,
    # o proxy derruba a conexão e o navegador reconecta. Não é defeito — é por isso que o motor
    # manda batida de coração periódica e a interface sabe se reconectar e reler o que perdeu.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
}
