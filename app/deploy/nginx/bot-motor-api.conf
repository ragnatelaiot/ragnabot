# Trecho a inserir no vhost `bot.ragnatela.com.br` do proxy reverso (XSEPRXRVS001).
#
# POR QUE AQUI E NÃO NO CLUSTER: o proxy é quem enxerga o IP REAL de quem chamou. Filtrar por
# origem dentro do cluster pega o IP do próprio proxy — o que não protege nada e ainda dá a
# impressão de que protege.
#
# `/motor-api/` é a porta pela qual o CONSOLE DE OPERAÇÃO (o NOC) fala com o motor do Ragnabot.
# Não é caminho de cliente: nenhum navegador de usuário passa por aqui.
location ^~ /motor-api/ {
    allow 172.20.11.20;   # NOC
    deny all;             # o resto do mundo nem chega ao cluster

    proxy_pass http://172.17.20.4;
    proxy_set_header Host              bot.ragnatela.com.br;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}
