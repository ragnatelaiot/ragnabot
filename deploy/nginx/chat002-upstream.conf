# Ragnabot (chat002) -> ingress do Kubernetes, NodePort 30080 nos 3 nos [NOC 2026-08-27]
upstream ragnabot_k8s {
    server 172.17.20.4:30080   max_fails=3 fail_timeout=15s;
    server 172.17.20.5:30080   max_fails=3 fail_timeout=15s;
    server 172.17.20.162:30080 max_fails=3 fail_timeout=15s;
    keepalive 16;
}
map $http_upgrade $ragnabot_conn_upgrade { default upgrade; '' close; }
