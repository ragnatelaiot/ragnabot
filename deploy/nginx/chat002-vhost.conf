# =============================================================================
# chat002.ragnatela.com.br — RAGNABOT (plataforma de atendimento, Kubernetes)
# NOC 2026-08-27. TLS termina aqui; o ingress do cluster recebe HTTP :30080.
# WebSocket (ActionCable /cable) exige os cabecalhos Upgrade — nao remover.
# ⚠️ O nome chat002 estava TAMBEM no vhost 'redirecionamento' (estacionamento) e
#    foi removido de la em 27/08 — server_name duplicado: vence quem carrega
#    primeiro e o ACME caia no 301 errado. NAO recolocar la.
# ⚠️ Linhagem do cert e a '-0001' (havia linhagem-base orfa, mesma pegadinha do
#    same01). O caminho abaixo foi resolvido dinamicamente na instalacao.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name chat002.ragnatela.com.br;
    access_log /var/log/nginx/chat002_access.log;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; allow all; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat002.ragnatela.com.br;
    ssl_certificate     /etc/letsencrypt/live/chat002.ragnatela.com.br-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat002.ragnatela.com.br-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/chat002_access.log;
    error_log  /var/log/nginx/chat002_error.log warn;
    server_tokens off;
    client_max_body_size 50m;
    location / {
        proxy_pass http://ragnabot_k8s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $ragnabot_conn_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
